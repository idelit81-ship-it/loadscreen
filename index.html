<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>З-СИТИ ХОРРОР — Загрузка</title>

    <style>
        :root {
            --red: #e3182d;
            --red-soft: rgba(227, 24, 45, .28);
            --text: #f3f3f3;
            --muted: rgba(255,255,255,.58);
            --panel: rgba(8, 4, 7, .62);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #080406;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
        }

        body {
            position: relative;
        }

        /* Основной фон */
        .background {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(to bottom, rgba(8,0,4,.05), rgba(5,0,3,.34)),
                url("https://raw.githubusercontent.com/idelit81-ship-it/loadscreen/refs/heads/main/%D0%97-%D0%A1%D0%98%D0%A2%D0%98_%20%D0%9A%D1%80%D0%B0%D1%81%D0%BD%D1%8B%D0%B9%20%D0%B3%D0%BE%D1%80%D0%BE%D0%B4%D1%81%D0%BA%D0%BE%D0%B9%20%D1%85%D0%BE%D1%80%D1%80%D0%BE%D1%80.png");
            background-size: cover;
            background-position: center;
            transform: scale(1.015);
            animation: breathe 12s ease-in-out infinite alternate;
        }

        @keyframes breathe {
            from { transform: scale(1.015); }
            to   { transform: scale(1.035); }
        }

        /* затемнение по краям */
        .vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at center,
                    transparent 42%,
                    rgba(0,0,0,.20) 68%,
                    rgba(0,0,0,.72) 100%);
        }

        /* лёгкая плёнка */
        .grain {
            position: absolute;
            inset: -50%;
            width: 200%;
            height: 200%;
            pointer-events: none;
            opacity: .055;
            background-image:
                repeating-radial-gradient(
                    circle at 0 0,
                    transparent 0,
                    rgba(255,255,255,.6) 1px,
                    transparent 2px
                );
            background-size: 7px 7px;
            animation: grain .22s steps(2) infinite;
        }

        @keyframes grain {
            0%   { transform: translate(0,0); }
            25%  { transform: translate(-1.5%,1%); }
            50%  { transform: translate(1%,-1.5%); }
            75%  { transform: translate(.5%,1.5%); }
            100% { transform: translate(-1%,.5%); }
        }

        /* очень тонкие VHS-линии */
        .scanlines {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: .08;
            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(255,255,255,.05) 0px,
                    rgba(255,255,255,.05) 1px,
                    transparent 1px,
                    transparent 4px
                );
        }

        .hud {
            position: absolute;
            left: 44px;
            right: 44px;
            bottom: 36px;
            display: flex;
            align-items: flex-end;
            gap: 28px;
        }

        .status-box {
            width: min(620px, 54vw);
            padding: 18px 20px 17px;
            background: linear-gradient(
                180deg,
                rgba(12,4,7,.50),
                rgba(6,2,4,.72)
            );
            border: 1px solid rgba(255,255,255,.08);
            box-shadow:
                0 14px 40px rgba(0,0,0,.28),
                inset 0 1px 0 rgba(255,255,255,.035);
            backdrop-filter: blur(5px);
        }

        .eyebrow {
            font-size: 10px;
            letter-spacing: .30em;
            text-transform: uppercase;
            color: rgba(255,255,255,.46);
            margin-bottom: 8px;
        }

        .status {
            font-size: clamp(17px, 1.3vw, 24px);
            font-weight: 700;
            letter-spacing: .035em;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-wrap {
            margin-top: 15px;
        }

        .progress-track {
            width: 100%;
            height: 4px;
            overflow: hidden;
            background: rgba(255,255,255,.10);
        }

        .progress-bar {
            height: 100%;
            width: 4%;
            background: var(--red);
            box-shadow: 0 0 14px rgba(227,24,45,.65);
            transition: width .3s ease;
        }

        .meta {
            margin-top: 10px;
            display: flex;
            gap: 18px;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: .05em;
        }

        .meta span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .counter {
            margin-left: auto;
            text-align: right;
            padding-bottom: 4px;
            text-shadow: 0 2px 12px rgba(0,0,0,.6);
        }

        .counter .number {
            font-size: clamp(24px, 2.2vw, 40px);
            font-weight: 800;
            line-height: 1;
        }

        .counter .label {
            margin-top: 7px;
            font-size: 10px;
            letter-spacing: .25em;
            color: rgba(255,255,255,.42);
            text-transform: uppercase;
        }

        .accent {
            color: var(--red);
        }

        /* Адаптация под небольшие экраны */
        @media (max-width: 800px) {
            .hud {
                left: 22px;
                right: 22px;
                bottom: 22px;
            }

            .status-box {
                width: 100%;
            }

            .counter {
                display: none;
            }

            .meta {
                display: block;
                line-height: 1.6;
            }
        }
    </style>
</head>

<body>
    <div class="background"></div>
    <div class="vignette"></div>
    <div class="scanlines"></div>
    <div class="grain"></div>

    <div class="hud">
        <div class="status-box">
            <div class="eyebrow">З-СИТИ ХОРРОР / ПОДКЛЮЧЕНИЕ</div>

            <div class="status" id="status">
                Получение сведений о сервере...
            </div>

            <div class="progress-wrap">
                <div class="progress-track">
                    <div class="progress-bar" id="progress"></div>
                </div>
            </div>

            <div class="meta">
                <span id="server">Сервер: З-СИТИ ХОРРОР</span>
                <span id="map">Карта: —</span>
                <span id="file">Подготовка...</span>
            </div>
        </div>

        <div class="counter">
            <div class="number">
                <span id="loaded">0</span><span class="accent"> / </span><span id="total">0</span>
            </div>
            <div class="label">файлов осталось</div>
        </div>
    </div>

    <script>
        let filesTotal = 0;
        let filesNeeded = 0;

        const statusEl   = document.getElementById("status");
        const progressEl = document.getElementById("progress");
        const serverEl   = document.getElementById("server");
        const mapEl      = document.getElementById("map");
        const fileEl     = document.getElementById("file");
        const loadedEl   = document.getElementById("loaded");
        const totalEl    = document.getElementById("total");

        function updateProgress() {
            if (filesTotal <= 0) {
                progressEl.style.width = "4%";
                loadedEl.textContent = "0";
                totalEl.textContent = "0";
                return;
            }

            const loaded = Math.max(0, filesTotal - filesNeeded);
            const percent = Math.max(2, Math.min(100, (loaded / filesTotal) * 100));

            progressEl.style.width = percent + "%";
            loadedEl.textContent = filesNeeded;
            totalEl.textContent = filesTotal;
        }

        /*
            Эти функции Garry's Mod вызывает автоматически.
        */

        function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language) {
            if (servername) {
                serverEl.textContent = "Сервер: " + servername;
            }

            if (mapname) {
                mapEl.textContent = "Карта: " + mapname;
            }
        }

        function SetFilesTotal(total) {
            filesTotal = Number(total) || 0;
            updateProgress();
        }

        function SetFilesNeeded(needed) {
            filesNeeded = Number(needed) || 0;
            updateProgress();
        }

        function DownloadingFile(fileName) {
            if (!fileName) return;

            const clean = fileName
                .replace(/^.*[\\\/]/, "")
                .replace(/\?.*$/, "");

            fileEl.textContent = clean || "Загрузка файла...";
        }

        function SetStatusChanged(status) {
            if (!status) return;
            statusEl.textContent = status;
        }

        /*
            Небольшая страховка для обычного браузера:
            загрузочный экран остаётся красивым и без GMod.
        */
        setTimeout(() => {
            if (statusEl.textContent.trim() === "Получение сведений о сервере...") {
                statusEl.textContent = "Подключение к З-СИТИ ХОРРОР...";
            }
        }, 2200);
    </script>
</body>
</html>
